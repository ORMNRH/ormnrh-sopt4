<!DOCTYPE html>
<html lang="th" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10B981">
  <meta name="google" content="notranslate">
  <title>สพท.4 Report</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="สพท.4">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #E8F7F2; }
    iframe { display: block; width: 100%; height: 100%; border: none; }
    #off { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 8px); z-index: 5; display: none; padding: 10px 14px; border-radius: 12px; background: #fef3c7; color: #92400e; font: 600 14px system-ui, sans-serif; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  </style>
</head>
<body>
  <!-- หน้านี้แค่ฝัง สพท.4 Report (รันบน Google Apps Script) ไว้ใน iframe เต็มจอ ให้ URL เป็นโดเมนนี้
       ข้อมูล/Sheet/โค้ดจริงอยู่ที่ Apps Script ทั้งหมด หน้านี้เก็บเฉพาะ session ไว้ใน localStorage ของโดเมนนี้ -->
  <iframe id="app" translate="no"
    src="https://script.google.com/macros/s/AKfycbzfx4nMiVe2aXyXoKVUtRvSQlMNmd0A3i7vBZvdHlS6PpZ1OoIddwUjbASSiKV65rxf/exec"
    title="สพท.4 Report" allow="clipboard-write"></iframe>
  <div id="off" role="status">ไม่มีสัญญาณอินเทอร์เน็ต — ข้อมูลที่ลงไว้จะถูกส่งเมื่อกลับมาออนไลน์</div>
  <script>
    (function () {
      // ---- installable app (Add to Home Screen) ----
      var deferred = null, frame = function () { return document.getElementById('app'); };
      var standalone = function () { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; };
      var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (/macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
      var installState = function () { return { type: 'sopt4-install-state', canInstall: !!deferred, standalone: standalone(), ios: ios }; };
      var tellApp = function () { try { var f = frame(); f && f.contentWindow && f.contentWindow.postMessage(installState(), '*'); } catch (e) { /* ignore */ } };
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; tellApp(); });
      window.addEventListener('appinstalled', function () { deferred = null; tellApp(); });
      if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* unsupported */ }); });
      var off = document.getElementById('off'), net = function () { off.style.display = navigator.onLine ? 'none' : 'block'; };
      window.addEventListener('online', net); window.addEventListener('offline', net); net();
      window.__installMsg = function (e) {
        if (e.data.type === 'sopt4-install') { if (deferred) { var d = deferred; d.prompt(); d.userChoice.then(function () { deferred = null; tellApp(); }); } return true; }
        return false;
      };
      var KEY = 'sopt4.wrap';
      var get = function () { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
      var set = function (t) { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) { /* blocked */ } };
      // returning from Google sign-in: #s=<session>
      var m = /[#&]s=([^&]+)/.exec(location.hash || '');
      var pendingId = '';
      var g = /[#&]id_token=([^&]+)/.exec(location.hash || '');
      if (g) { pendingId = decodeURIComponent(g[1]); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } }
      if (m) { set(decodeURIComponent(m[1])); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } }
      window.addEventListener('message', function (e) {
        if (!e.data || !/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/.test(e.origin)) return; // app runs 2 frames deep (googleusercontent sandbox)
        if (window.__installMsg(e)) return;
        if (e.data.type === 'sopt4-hello') { e.source.postMessage({ type: 'sopt4-token', token: get(), idToken: pendingId, home: location.origin + location.pathname }, '*'); pendingId = ''; setTimeout(tellApp, 300); }
        else if (e.data.type === 'sopt4-token-set') set(String(e.data.token || ''));
        else if (e.data.type === 'sopt4-google-logout' && /^https:\/\/accounts\.google\.com\/Logout/.test(String(e.data.url))) { set(''); location.href = e.data.url; }
        else if (e.data.type === 'sopt4-reload') { var f = document.getElementById('app'); f.src = f.src; }
      });
    })();
  </script>
</body>
</html>
